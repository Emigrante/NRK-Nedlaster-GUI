name: Build Mac Version

on:
  release:
    types: [published]

jobs:
  build-mac:
    name: Build macOS App
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Publish Mac Version
      # Bygger Mac-prosjektet
      run: dotnet publish NRKLastNed.Mac/NRKLastNed.Mac.csproj -c Release -r osx-x64 --self-contained -o ./publish/mac
      
    - name: Fix Permissions
      run: |
        chmod +x ./publish/mac/NRKLastNed.Mac
        
    - name: Set Release Filename
      run: |
        TAG="${{ github.event.release.tag_name }}"
        if [[ "$TAG" != v* ]]; then
          TAG="v${TAG}"
        fi
        echo "ZIP_NAME=NRK_Nedlaster_macOS_${TAG}_x64.zip" >> $GITHUB_ENV

    - name: Zip Mac Release
      # Pakker alt inn i en ZIP som Mac-brukere kan laste ned
      run: |
        cd publish/mac
        zip -r "../../${{ env.ZIP_NAME }}" .
        cd ../..
      
    - name: Upload Mac Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./${{ env.ZIP_NAME }}
        asset_name: ${{ env.ZIP_NAME }}
        asset_content_type: application/zip
